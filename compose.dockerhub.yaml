name: diaries-local-published-smoke

services:
  diaries-db:
    image: postgres:18-alpine
    container_name: diaries-published-smoke-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DIARIES_DB_NAME:-diaries}
      POSTGRES_USER: ${DIARIES_DB_USERNAME:-diaries}
      POSTGRES_PASSWORD: ${DIARIES_DB_PASSWORD:-diaries}
    ports:
      - "${DIARIES_DB_HOST_PORT:-5433}:5432"
    volumes:
      - diaries-published-smoke-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  diaries-mqtt:
    image: eclipse-mosquitto:2
    container_name: diaries-published-smoke-mqtt
    restart: unless-stopped
    environment:
      DIARIES_MQTT_HEALTH_USERNAME: ${DIARIES_MQTT_HEALTH_USERNAME}
      DIARIES_MQTT_HEALTH_PASSWORD: ${DIARIES_MQTT_HEALTH_PASSWORD}
    ports:
      - "${DIARIES_MQTT_HOST_PORT:-1883}:1883"
      - "${DIARIES_MQTT_WEBSOCKET_HOST_PORT:-9001}:9001"
    volumes:
      - ./config/mosquitto/development/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/mosquitto/development/aclfile.txt:/mosquitto/config/aclfile.txt:ro
      - ./config/mosquitto/development/pwfile.txt:/mosquitto/config/pwfile.txt:ro
      - diaries-published-smoke-mqtt-data:/mosquitto/data
      - diaries-published-smoke-mqtt-log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -p 1883 -u \"$${DIARIES_MQTT_HEALTH_USERNAME}\" -P \"$${DIARIES_MQTT_HEALTH_PASSWORD}\" -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 10s

  diaries-responder:
    image: rsmaxwell/diaries-responder:${DIARIES_IMAGE_TAG:-integration}
    container_name: diaries-published-smoke-responder
    restart: unless-stopped
    depends_on:
      diaries-db:
        condition: service_healthy
      diaries-mqtt:
        condition: service_healthy
    environment:
      CONFIG_FILE: /config/responder.json
    ports:
      - "${DIARIES_RESPONDER_HTTP_HOST_PORT:-8081}:8081"
    volumes:
      - ./config/local-published-smoke/responder.json:/config/responder.json:ro
      - diaries-published-smoke-content:/data
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null http://localhost:8081/not-a-responder-path"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  diaries-client:
    image: rsmaxwell/diaries-client:${DIARIES_IMAGE_TAG:-integration}
    container_name: diaries-published-smoke-client
    restart: unless-stopped
    depends_on:
      diaries-responder:
        condition: service_healthy
    ports:
      - "${DIARIES_CLIENT_HTTP_HOST_PORT:-8080}:8080"
    volumes:
      - ./diaries-client/public/assets/config.direct.json:/app/www/assets/config.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  diaries-published-smoke-db-data:
  diaries-published-smoke-mqtt-data:
  diaries-published-smoke-mqtt-log:
  diaries-published-smoke-content:
