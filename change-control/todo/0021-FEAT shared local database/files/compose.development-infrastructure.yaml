name: ledger-development-infrastructure

services:
  ledger-db:
    image: postgres:18-alpine
    container_name: ledger-local-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${LEDGER_DB_NAME:-ledger}
      POSTGRES_USER: ${LEDGER_DB_USERNAME:-ledger}
      POSTGRES_PASSWORD: ${LEDGER_DB_PASSWORD:-ledger}
    ports:
      - "${LEDGER_DB_PORT:-5433}:5432"
    volumes:
      - "${LEDGER_DB_DATA_DIR:?LEDGER_DB_DATA_DIR must be set}:/var/lib/postgresql"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10

