
name: diaries-local-published-smoke

services:

  diaries-db:
    image: postgres:18-alpine
    container_name: diaries-published-smoke-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DIARIES_DB_NAME}
      POSTGRES_USER: ${DIARIES_DB_USERNAME}
      POSTGRES_PASSWORD: ${DIARIES_DB_PASSWORD}
    ports:
      - "${DIARIES_DB_HOST_PORT:-5433}:5432"
    volumes:
      - "${DIARIES_DB_DATA_DIR}:/var/lib/postgresql"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  diaries-mqtt:
    image: eclipse-mosquitto:2
    container_name: diaries-published-smoke-mqtt
    restart: unless-stopped
    environment:
      DIARIES_MQTT_HEALTH_USERNAME: ${DIARIES_MQTT_HEALTH_USERNAME}
      DIARIES_MQTT_HEALTH_PASSWORD: ${DIARIES_MQTT_HEALTH_PASSWORD}
    ports:
      - "${DIARIES_MQTT_HOST_PORT:-1883}:1883"
      - "${DIARIES_MQTT_WEBSOCKET_HOST_PORT:-9001}:9001"
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./config/mosquitto/aclfile.txt:/mosquitto/config/aclfile.txt:ro
      - ./config/mosquitto/pwfile.txt:/mosquitto/config/pwfile.txt:ro
      - diaries-published-smoke-mqtt-data:/mosquitto/data
      - diaries-published-smoke-mqtt-log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -p 1883 -u \"$${DIARIES_MQTT_HEALTH_USERNAME}\" -P \"$${DIARIES_MQTT_HEALTH_PASSWORD}\" -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 6s
      retries: 10
      start_period: 10s


  diaries-responder:
    image: rsmaxwell/diaries-responder:${DIARIES_RESPONDER_IMAGE_TAG:-${DIARIES_IMAGE_TAG:-integration}}
    container_name: diaries-published-smoke-responder
    restart: unless-stopped
    depends_on:
      diaries-db:
        condition: service_healthy
      diaries-mqtt:
        condition: service_healthy
    environment:
      CONFIG_FILE: /config/responder.json
    ports:
      - "${DIARIES_RESPONDER_HTTP_HOST_PORT:-8081}:8081"
    volumes:
      - type: bind
        source: ${DIARIES_RESPONDER_DOCKER_CONFIG_FILE}
        target: /config/responder.json
        read_only: true

      - type: volume
        source: nas-photo
        target: /data/diaries
        read_only: true
        volume:
          subpath: ${DIARIES_NAS_CONTENT_PATH}/diaries

      - type: volume
        source: nas-photo
        target: /data/files
        read_only: false
        volume:
          subpath: ${DIARIES_NAS_CONTENT_PATH}/files

    healthcheck:
      test: ["CMD-SHELL", "curl --silent --output /dev/null http://localhost:8081/not-a-responder-path"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


  diaries-client:
    image: rsmaxwell/diaries-client:${DIARIES_CLIENT_IMAGE_TAG:-${DIARIES_IMAGE_TAG:-integration}}
    container_name: diaries-published-smoke-client
    restart: unless-stopped
    depends_on:
      diaries-responder:
        condition: service_healthy
    ports:
      - "${DIARIES_CLIENT_HTTP_HOST_PORT:-8080}:8080"
    volumes:
      - ./diaries-client/public/assets/config.json:/usr/share/nginx/html/diaries/assets/config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://localhost:8080/diaries/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  diaries-published-smoke-mqtt-data:
  diaries-published-smoke-mqtt-log:
  nas-photo:
    driver: local
    driver_opts:
      type: cifs
      device: //${DIARIES_NAS_HOST}/${DIARIES_NAS_SHARE}
      o: username=${DIARIES_NAS_USERNAME},password=${DIARIES_NAS_PASSWORD},vers=3.0
