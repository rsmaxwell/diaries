---

- name: diaries:standalone-frontend | Remove stale shared Nginx location
  ansible.builtin.file:
    path: "{{ diaries_shared_frontend_location_file }}"
    state: absent
  register: diaries_stale_shared_frontend_config

- name: diaries:standalone-frontend | Check whether shared Nginx is running
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - -f
      - "{{ '{{' }}.State.Running{{ '}}' }}"
      - "{{ diaries_shared_frontend_nginx_container_name }}"
  changed_when: false
  failed_when: false
  register: diaries_shared_nginx_running
  when: diaries_stale_shared_frontend_config.changed

- name: diaries:standalone-frontend | Validate shared Nginx after removing stale route
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ diaries_shared_frontend_nginx_container_name }}"
      - nginx
      - -t
  changed_when: false
  when:
    - diaries_stale_shared_frontend_config.changed
    - diaries_shared_nginx_running.rc == 0
    - diaries_shared_nginx_running.stdout == 'true'

- name: diaries:standalone-frontend | Reload shared Nginx after removing stale route
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ diaries_shared_frontend_nginx_container_name }}"
      - nginx
      - -s
      - reload
  changed_when: true
  when:
    - diaries_stale_shared_frontend_config.changed
    - diaries_shared_nginx_running.rc == 0
    - diaries_shared_nginx_running.stdout == 'true'
