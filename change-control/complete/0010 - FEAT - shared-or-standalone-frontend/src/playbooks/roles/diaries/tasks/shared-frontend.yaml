---

- name: diaries:shared-frontend | Check the shared Docker network exists
  ansible.builtin.command:
    argv:
      - docker
      - network
      - inspect
      - "{{ diaries_shared_network_name }}"
  changed_when: false
  register: diaries_shared_network_check
  failed_when: false

- name: diaries:shared-frontend | Require the shared Docker network
  ansible.builtin.assert:
    that:
      - diaries_shared_network_check.rc == 0
    fail_msg: >-
      Shared frontend mode requires the external Docker network
      '{{ diaries_shared_network_name }}'. Install/start the infrastructure
      stack before deploying Diaries in shared mode.

- name: diaries:shared-frontend | Check the shared Nginx container exists
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - "{{ diaries_shared_frontend_nginx_container_name }}"
  changed_when: false
  register: diaries_shared_nginx_check
  failed_when: false

- name: diaries:shared-frontend | Require the shared Nginx container
  ansible.builtin.assert:
    that:
      - diaries_shared_nginx_check.rc == 0
    fail_msg: >-
      Shared frontend mode requires the Nginx container
      '{{ diaries_shared_frontend_nginx_container_name }}'. Install/start the
      infrastructure stack before deploying Diaries in shared mode.

- name: diaries:shared-frontend | Check the shared Nginx location directory exists
  ansible.builtin.stat:
    path: "{{ diaries_shared_frontend_location_dir }}"
  register: diaries_shared_frontend_location_dir_stat

- name: diaries:shared-frontend | Require the shared Nginx location directory
  ansible.builtin.assert:
    that:
      - diaries_shared_frontend_location_dir_stat.stat.isdir | default(false)
    fail_msg: >-
      Shared frontend mode requires the infrastructure Nginx location directory
      '{{ diaries_shared_frontend_location_dir }}'.

- name: diaries:shared-frontend | Install Diaries location in shared Nginx
  ansible.builtin.template:
    src: config/nginx/shared/diaries.conf.j2
    dest: "{{ diaries_shared_frontend_location_file }}"
    mode: "0644"
  register: diaries_shared_frontend_config

- name: diaries:shared-frontend | Validate shared Nginx configuration
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ diaries_shared_frontend_nginx_container_name }}"
      - nginx
      - -t
  changed_when: false
  when: diaries_shared_frontend_config.changed

- name: diaries:shared-frontend | Reload shared Nginx
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ diaries_shared_frontend_nginx_container_name }}"
      - nginx
      - -s
      - reload
  when: diaries_shared_frontend_config.changed
  changed_when: true
