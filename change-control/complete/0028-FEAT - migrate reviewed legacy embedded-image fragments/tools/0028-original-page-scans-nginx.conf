# 0028 isolated read-only source page scans; backend Docker bridge ONLY.
server {
    listen 8080;
    server_name _;
    access_log /dev/stdout;
    location ^~ /diaries/ {
        alias /usr/share/nginx/html/diaries/;
        autoindex off;
        limit_except GET { deny all; }
        add_header Cache-Control 'private, no-store' always;
    }
    location / { return 404; }
}
