# 0028-FEAT isolated browser gateway; no access to production endpoints.
# This configuration is mounted read-only into nginx:alpine conf.d/default.conf.
# Only the proxy joins the normal (non-internal) frontend network.
server {
    listen 8081;
    server_name _;
    access_log /dev/stdout;
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_pass http://diaries-0028-replay-responder:8081;
    }
}
