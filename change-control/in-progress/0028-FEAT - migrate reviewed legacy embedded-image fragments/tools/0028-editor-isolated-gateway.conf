# 0028 isolated Editor-only HTTP proxy, dual-homed to the labelled internal
# rehearsal bridge and frontend bridge; ONLY localhost port 58083 is published.
server {
    listen 8083;
    server_name _;
    access_log /dev/stdout;
    add_header X-Diaries-Rehearsal '0028-isolated-editor' always;
    location ^~ /mosquitto/ {
        proxy_pass http://diaries-0028-replay-editor-ws-bridge:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # Match the Angular ConfigService's same-origin /diaries-responder prefix.
    # Original manuscript page scans come from the previously verified volume.
    location ^~ /diaries-responder/diaries/ {
        rewrite ^/diaries-responder(/diaries/.*)$ $1 break;
        proxy_pass http://diaries-0028-replay-source-scans:8080;
        proxy_set_header Host $http_host;
    }
    # Catalogue media and HTTP API come from the isolated responder.
    location ^~ /diaries-responder/ {
        rewrite ^/diaries-responder/(.*)$ /$1 break;
        proxy_pass http://diaries-0028-replay-responder:8081;
        proxy_set_header Host $http_host;
    }
    location / {
        proxy_pass http://diaries-0028-replay-editor:8080;
        proxy_set_header Host $http_host;
    }
}
