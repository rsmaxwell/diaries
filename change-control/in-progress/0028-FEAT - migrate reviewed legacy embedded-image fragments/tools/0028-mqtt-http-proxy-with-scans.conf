# 0028 isolated Reader and responder proxy; only this container is dual-homed.
# Original page scans are served from a read-only backend sidecar, not NAS.
server {
    listen 8081;
    server_name _;
    access_log /dev/stdout;
    location ^~ /diaries/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_pass http://diaries-0028-replay-source-scans:8080;
    }
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_pass http://diaries-0028-replay-responder:8081;
    }
}
server {
    listen 8082;
    server_name _;
    access_log /dev/stdout;
    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_pass http://diaries-0028-replay-reader:8082;
    }
}
