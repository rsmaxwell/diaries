
listener 1883
socket_domain ipv4

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/pwfile.txt

persistence true
persistence_location /mosquitto/data/

log_type error
log_type warning
log_type notice
#log_type information
#log_type all

acl_file /mosquitto/config/aclfile.txt

max_queued_messages  10000

