listener 1883
socket_domain ipv4

listener 9001
protocol websockets
socket_domain ipv4

# Functional regression fixture only: browser tests use anonymous MQTT while responder
# tests may still send their normal credentials. Production authentication/ACL policy is
# deliberately separate from this disposable broker.
allow_anonymous true

persistence false

# Match the application broker flow-control assumptions used by Image/MQTT regression tests.
max_inflight_messages 20
max_queued_messages 0
